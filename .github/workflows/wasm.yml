name: WASM Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component@0.21.1

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.261.0

      - name: Validate WIT conformance
        run: cargo run -p build-scripts --release -- validate

      - name: Build SDK component
        run: cargo component build -p antikythera-sdk --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo component build -p antikythera-toolrunner --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo component build -p antikythera-default-hooks --release --target wasm32-wasip2 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip2/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip2/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip2/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip2/release/antikythera-default-hooks.wasm

          wasm-tools compose target/wasm32-wasip2/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip2/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip2/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm

          cp wit/antikythera.wit dist/antikythera.wit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: clients
        run: npm install

      - name: Transpile and name both client bundles with jco
        run: node src/scripts/transpile-client.mjs

      - name: Verify core-module naming and component loading
        run: |
          node --test tests/node/core-module-names.test.mjs
          node tests/node/component-smoke.mjs

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antikythera-wasm
          path: dist/

      - name: Upload component transpile artifact
        uses: actions/upload-artifact@v4
        with:
          name: antikythera-wasm-component
          path: clients/npm/antikythera-sdk/component/
          if-no-files-found: error
