name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.0). Required for manual dispatch; ignored on tag push.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-wasm-component:
    name: Build WASM Component + jco Transpile
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component@0.21.1

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.261.0

      - name: Verify release version matches Cargo workspace version
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          CARGO_VERSION="$(cargo run -p build-scripts --bin sync-release-version -- --print)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release version '${VERSION}' does not match Cargo workspace version '${CARGO_VERSION}'"
            exit 1
          fi
          echo "release version ${VERSION} matches Cargo workspace version ${CARGO_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: clients
        run: npm install

      - name: Build SDK component
        run: cargo build -p antikythera-sdk --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo build -p antikythera-toolrunner --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo build -p antikythera-default-hooks --release --target wasm32-wasip2 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip2/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip2/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip2/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip2/release/antikythera-default-hooks.wasm
          wasm-tools compose target/wasm32-wasip2/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip2/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip2/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm

      - name: Transpile composite WASM component to JS with jco
        run: node src/scripts/transpile-client.mjs


      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify component runtime before publishing artifacts
        run: |
          pip install "setuptools>=68" wheel
          pip install -e "clients/python[dev,wasm]"
          cargo build -p logic-core-host-example -p logic-core-example --release --target wasm32-wasip2 --no-default-features --features component
          cargo test -p antikythera-tests --test compatibility_tests
          cargo test -p antikythera-server-runtime
          cargo build -p antikythera-server-runtime
          cp target/debug/antikythera-server-runtime target/debug/antikythera-server-runtime.exe
          node --test --test-concurrency=1 tests/node/*.test.mjs
          python -m pytest tests/python -q

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging/component
          cp -r clients/npm/antikythera-sdk/component/. staging/component/
          cp dist/antikythera-sdk.wasm staging/antikythera-sdk.wasm
          cp wit/antikythera.wit staging/antikythera.wit

      - name: Upload WASM component artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-component
          path: staging/
          if-no-files-found: error

  build-wasm-server:
    name: Build Server WASM (WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install WASI SDK
        run: |
          set -e
          curl -sL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -C /opt -xzf wasi-sdk.tar.gz --strip-components=1
          echo "/opt/bin" >> $GITHUB_PATH

      - name: Configure cross-compilation environment
        run: |
          echo "CC_wasm32_wasip2=/opt/bin/clang" >> $GITHUB_ENV
          echo "AR_wasm32_wasip2=/opt/bin/llvm-ar" >> $GITHUB_ENV
          echo "CFLAGS_wasm32_wasip2=--sysroot=/opt/share/wasi-sysroot" >> $GITHUB_ENV

      - name: Install cargo-component
        run: cargo install cargo-component --version 0.21.1 --locked

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.261.0

      - name: Build SDK component
        run: cargo build -p antikythera-sdk --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo build -p antikythera-toolrunner --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo build -p antikythera-default-hooks --release --target wasm32-wasip2 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip2/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip2/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip2/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip2/release/antikythera-default-hooks.wasm
          wasm-tools compose target/wasm32-wasip2/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip2/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip2/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm
          # wasm-server consumers (publish-pypi rename, create-release attach)
          # expect the underscore-crate filename; stage a copy for the artifact.
          cp dist/antikythera-sdk.wasm staging/antikythera_sdk.wasm

      - name: Upload server WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-server
          path: staging/antikythera_sdk.wasm

  publish-npm:
    name: Publish npm Package
    needs: [build-wasm-component]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download WASM component artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-component
          path: clients/npm/antikythera-sdk/

      - name: Align Python bundle for the cross-package publication gate
        run: |
          cp -r clients/npm/antikythera-sdk/component/. clients/python/antikythera_agent/component/
          cp clients/npm/antikythera-sdk/antikythera-sdk.wasm clients/python/antikythera_agent/antikythera.wasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from Cargo workspace
        run: |
          cargo run -p build-scripts --bin sync-release-version
          echo "npm version set to $(cargo run -p build-scripts --bin sync-release-version -- --print)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wheel tooling for package gate
        run: pip install "setuptools>=68" wheel

      - name: Publish to npm
        working-directory: clients/npm/antikythera-sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python Package
    needs: [build-wasm-component, build-wasm-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download WASM component artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-component
          path: clients/npm/antikythera-sdk/

      - name: Embed the verified composite used by the jco client
        run: cp clients/npm/antikythera-sdk/antikythera-sdk.wasm clients/python/antikythera_agent/antikythera.wasm

      - name: Copy jco component bundle into Python package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clients/python/antikythera_agent/component
          cp -r clients/npm/antikythera-sdk/component/. clients/python/antikythera_agent/component/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from Cargo workspace
        run: |
          cargo run -p build-scripts --bin sync-release-version
          echo "Python version set to $(cargo run -p build-scripts --bin sync-release-version -- --print)"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: clients/python
        run: python -m build

      - name: Publish to PyPI
        working-directory: clients/python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-wasm-component, build-wasm-server, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download server WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-server
          path: wasm-server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-wasm-component.outputs.version }}
          name: v${{ needs.build-wasm-component.outputs.version }}
          generate_release_notes: true
          files: wasm-server/antikythera_sdk.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
