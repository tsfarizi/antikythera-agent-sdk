name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  checks: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Component acceptance runs below in runtime-bridge after artifacts are built.
      - run: cargo test --workspace --exclude antikythera-server-runtime --exclude antikythera-tests
      - run: cargo test -p antikythera-server-runtime --lib
      - run: cargo clippy --workspace --lib --bins -- -D warnings -D deprecated

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: pip install -e "clients/python[dev]"
      - name: Run Python test suite
        run: python -m pytest tests/python/ -q --basetemp "${{ runner.temp }}/pytest" -p no:cacheprovider
        env:
          PYTHONPATH: clients/python

  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static gate tools
        run: pip install ruff mypy pytest
      - name: Ruff lint gates
        run: ruff check clients/python/antikythera_agent tests/python
      - name: Mypy type gates
        run: mypy clients/python/antikythera_agent --config-file clients/python/pyproject.toml

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo check --workspace

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p antikythera-sdk --target wasm32-wasip2 --no-default-features --features component

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate WIT conformance
        run: cargo run -p build-scripts --release -- validate

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify npm and python versions match Cargo workspace version
        run: cargo run -p build-scripts --bin sync-release-version -- --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook
      - run: mdbook build

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/examples/antikythera-web/package-lock.json
      - name: Install dependencies
        working-directory: src/examples/antikythera-web
        run: npm ci
      - name: Build web example
        working-directory: src/examples/antikythera-web
        run: npm run build

  wasm-component-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component@0.21.1

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.261.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: pip install -e "clients/python[dev]"

      - name: Install npm dependencies
        working-directory: clients
        run: npm install

      - name: Build SDK component
        run: cargo build -p antikythera-sdk --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo build -p antikythera-toolrunner --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo build -p antikythera-default-hooks --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build logic-core-host-example component
        run: cargo build -p logic-core-host-example --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build logic-core-example component
        run: cargo build -p logic-core-example --release --target wasm32-wasip2 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip2/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip2/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip2/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip2/release/antikythera-default-hooks.wasm
          wasm-tools compose target/wasm32-wasip2/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip2/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip2/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm

      - name: Build native server-runtime binary (debug)
        run: |
          cargo build -p antikythera-server-runtime
          # runtime-bridge.test.mjs pins the server binary path as
          # target/debug/antikythera-server-runtime.exe (Windows layout);
          # cargo emits no .exe suffix on Linux, so alias the native build.
          cp target/debug/antikythera-server-runtime target/debug/antikythera-server-runtime.exe

      - name: Transpile composite WASM component to JS with jco
        run: node src/scripts/transpile-client.mjs


      - name: Run composite compatibility tests
        run: cargo test -p antikythera-tests

      - name: Run server runtime bridge acceptance tests
        run: cargo test -p antikythera-server-runtime --test runtime_bridge

      - name: Smoke test transpiled WASM component
        run: node tests/node/component-smoke.mjs

      - name: Run Node.js SDK test suites
        run: node --test --test-concurrency=1 tests/node/*.test.mjs
        env:
          PYTHONPATH: ${{ github.workspace }}/clients/python

      - name: Verify TypeScript delivery API declarations
        run: npm --prefix clients run test:types
