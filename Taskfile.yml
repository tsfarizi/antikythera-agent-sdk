# Taskfile for Antikythera Agent SDK
# Usage: task <task-name>
# Docs: https://taskfile.dev

version: '3'

silent: true

dotenv:
  - config/.env

vars:
  WASM_TARGET: wasm32-wasip2
  WASM_BINARY: target/{{.WASM_TARGET}}/release/antikythera_sdk.wasm
  TOOLRUNNER_BINARY: target/{{.WASM_TARGET}}/release/antikythera_toolrunner.wasm
  # wasm-tools compose rejects crate names with underscores; the toolrunner
  # component must be copied to a kebab-case name before composing.
  TOOLRUNNER_KEBAB: target/{{.WASM_TARGET}}/release/antikythera-toolrunner.wasm
  DEFAULT_HOOKS_BINARY: target/{{.WASM_TARGET}}/release/antikythera_default_hooks.wasm
  # Same kebab-case requirement as the toolrunner: wasm-tools compose rejects
  # the underscore crate name of antikythera_default_hooks.wasm.
  DEFAULT_HOOKS_KEBAB: target/{{.WASM_TARGET}}/release/antikythera-default-hooks.wasm
  # Drop-in logic-core components are host-authored: consumed directly as
  # standalone .wasm artifacts, never composed into dist/ (no kebab-case
  # copies needed).
  LOGIC_CORE_TEMPLATE_BINARY: target/{{.WASM_TARGET}}/release/logic_core_template.wasm
  LOGIC_CORE_EXAMPLE_BINARY: target/{{.WASM_TARGET}}/release/logic_core_example.wasm
  DIST_SDK: dist/antikythera-sdk.wasm
  DIST_SDK_CUSTOM: dist/antikythera-sdk-custom.wasm
  # The Python package embeds the composite; runtime.py resolves this exact
  # path at import time (_WASM_PATH = Path(__file__).parent / "antikythera.wasm").
  PYTHON_WASM: clients/python/antikythera_agent/antikythera.wasm
  # Path to a built custom logic-hooks component (host-authored override).
  # Empty by default; compose-hooks-custom fails fast until HOOKS_COMPONENT is
  # set explicitly (no silent fallback to an example component).
  HOOKS_COMPONENT: '{{default "" .HOOKS_COMPONENT}}'
  APP_CONFIG: app.toml
  PROVIDER_ID: '{{default "local-ollama" .PROVIDER_ID}}'
  PROVIDER_TYPE: '{{default "ollama" .PROVIDER_TYPE}}'
  PROVIDER_ENDPOINT: '{{default "http://127.0.0.1:11434" .PROVIDER_ENDPOINT}}'
  PROVIDER_API_KEY: '{{default "" .PROVIDER_API_KEY}}'
  MODEL_NAME: '{{default "gpt-oss:120b-cloud" .MODEL_NAME}}'

tasks:

  # ===========================================================================
  # Default Task - Show Help
  # ===========================================================================
  default:
    desc: Show available tasks
    cmds:
      - |
        echo "Antikythera Agent SDK - Available Tasks"
        echo ""
        echo "  === Native Development (No WASM Required) ==="
        echo "  task run             - Run chat agent (Ollama, default model)"
        echo "  task run-model       - Run chat agent with custom model (MODEL_NAME=xxx)"
        echo "  task run-chat        - Run chat example from examples/chat"
        echo "  task check-native    - Check code (native target only)"
        echo "  task test-native     - Run tests (native target only)"
        echo ""
        echo "  === WASM Development (Optional) ==="
        echo "  task build           - Build composite WASM component (SDK + toolrunner + default-hooks -> dist/antikythera-sdk.wasm)"
        echo "  task build-wasm-harness - Build standalone SDK WASM artifact (for FFI host harness)"
        echo "  task build-toolrunner - Build standalone toolrunner WASM artifact"
        echo "  task build-default-hooks - Build standalone default-hooks WASM artifact"
        echo "  task build-logic-core-template - Build standalone logic-core template WASM artifact"
        echo "  task build-logic-core-example - Build standalone logic-core example WASM artifact"
        echo "  task compose         - Compose SDK + toolrunner + default-hooks into dist/antikythera-sdk.wasm"
        echo "  task compose-hooks-custom - Compose SDK + toolrunner + CUSTOM hooks (HOOKS_COMPONENT=...) into dist/antikythera-sdk-custom.wasm"
        echo "  task build-python-wasm - Copy composite WASM + jco component bundle into Python package (clients/python/antikythera_agent/)"
        echo "  task build-all       - Build all WASM artifacts (standalone SDK + toolrunner + default-hooks + composite)"
        echo "  task check-wasm      - Check WASM compilation"
        echo "  task transpile       - Transpile composite (dist) to JS bindings with jco"
        echo "  task inspect         - Inspect composite component with wasm-tools"
        echo ""
        echo "  === Examples ==="
        echo "  task run-web         - Run web frontend dev server"
        echo "  task build-web       - Build web frontend for production"
        echo ""
        echo "  === Quality ==="
        echo "  task check           - Check all code"
        echo "  task test            - Run all tests"
        echo "  task lint            - Run clippy linter"
        echo "  task format          - Format code with rustfmt"
        echo ""

  # ===========================================================================
  # Build Tasks
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # WASM deliverables are COMPOSITE: the runner component (antikythera-sdk)
  # imports tool-registry AND logic-hooks; the toolrunner component exports
  # tool-registry and the default-hooks component exports logic-hooks.
  # `wasm-tools compose` wires all three into dist/antikythera-sdk.wasm.
  # Anything consuming dist (jco transpile, wasmtime harness) MUST see the
  # composite, never the standalone SDK (it carries unmet tool-registry and
  # logic-hooks imports and fails runtime smoke).
  # ---------------------------------------------------------------------------

  build:
    desc: Build composite WASM component (SDK + toolrunner + default-hooks -> dist/antikythera-sdk.wasm)
    deps:
      - wit
    cmds:
      - echo "Building composite WASM component..."
      - task: compose

  build-wasm-harness:
    desc: Build standalone SDK WASM component (wasm32-wasip2, feature component)
    deps:
      - wit
    cmds:
      - echo "Building standalone SDK WASM component..."
      - cargo build -p antikythera-sdk --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK standalone SDK component built: {{.WASM_BINARY}}"'
      - task: size

  build-toolrunner:
    desc: Build standalone toolrunner WASM component (wasm32-wasip2, feature component)
    cmds:
      - echo "Building standalone toolrunner WASM component..."
      - cargo build -p antikythera-toolrunner --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK standalone toolrunner component built: {{.TOOLRUNNER_BINARY}}"'
      - task: size

  build-default-hooks:
    desc: Build standalone default-hooks WASM component (wasm32-wasip2, feature component)
    cmds:
      - echo "Building standalone default-hooks WASM component..."
      - cargo build -p antikythera-default-hooks --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK standalone default-hooks component built: {{.DEFAULT_HOOKS_BINARY}}"'
      - task: size

  build-logic-core-template:
    desc: Build standalone logic-core template WASM component (wasm32-wasip2, feature component)
    cmds:
      - echo "Building standalone logic-core template WASM component..."
      - cargo build -p logic-core-template --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK logic-core template component built: {{.LOGIC_CORE_TEMPLATE_BINARY}}"'
      - task: size

  build-logic-core-example:
    desc: Build standalone logic-core example WASM component (wasm32-wasip2, feature component)
    cmds:
      - echo "Building standalone logic-core example WASM component..."
      - cargo build -p logic-core-example --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK logic-core example component built: {{.LOGIC_CORE_EXAMPLE_BINARY}}"'
      - task: size

  compose:
    desc: Compose SDK + toolrunner + default-hooks into composite dist/antikythera-sdk.wasm
    deps:
      - build-wasm-harness
      - build-toolrunner
      - build-default-hooks
    cmds:
      - echo "Composing SDK + toolrunner + default-hooks into composite..."
      - mkdir -p dist
      # wasm-tools compose rejects the underscore crate names; use kebab-case copies.
      - cp {{.TOOLRUNNER_BINARY}} {{.TOOLRUNNER_KEBAB}}
      - cp {{.DEFAULT_HOOKS_BINARY}} {{.DEFAULT_HOOKS_KEBAB}}
      - wasm-tools compose {{.WASM_BINARY}} -d {{.TOOLRUNNER_KEBAB}} -d {{.DEFAULT_HOOKS_KEBAB}} -o {{.DIST_SDK}}
      - echo ""
      - 'echo "OK composite built: {{.DIST_SDK}}"'
      - task: size

  compose-hooks-custom:
    desc: Compose SDK + toolrunner + CUSTOM hooks into dist/antikythera-sdk-custom.wasm. Requires HOOKS_COMPONENT=<path to a built custom logic-hooks .wasm>; the file must be kebab-case named because wasm-tools compose rejects underscore filenames (build the hooks crate with the component feature first, e.g. cargo build -p logic-hooks-example --target wasm32-wasip2 --release --no-default-features --features component, then cp target/wasm32-wasip2/release/logic_hooks_example.wasm target/wasm32-wasip2/release/logic-hooks-example.wasm).
    deps:
      - build-wasm-harness
      - build-toolrunner
    cmds:
      - |
        if [ -z "{{.HOOKS_COMPONENT}}" ]; then
          echo "ERROR: HOOKS_COMPONENT is required." >&2
          echo "Set it to the path of a built custom logic-hooks WASM component (kebab-case filename), e.g.:" >&2
          echo "  cp target/wasm32-wasip2/release/logic_hooks_example.wasm target/wasm32-wasip2/release/logic-hooks-example.wasm" >&2
          echo "  task compose-hooks-custom HOOKS_COMPONENT=target/wasm32-wasip2/release/logic-hooks-example.wasm" >&2
          exit 1
        fi
      - echo "Composing SDK + toolrunner + custom hooks into composite..."
      - mkdir -p dist
      - cp {{.TOOLRUNNER_BINARY}} {{.TOOLRUNNER_KEBAB}}
      - wasm-tools compose {{.WASM_BINARY}} -d {{.TOOLRUNNER_KEBAB}} -d {{.HOOKS_COMPONENT}} -o {{.DIST_SDK_CUSTOM}}
      - echo ""
      - 'echo "OK composite built: {{.DIST_SDK_CUSTOM}}"'
      - task: size

  build-python-wasm:
    desc: Copy composite WASM and jco component bundle into the Python package (clients/python/antikythera_agent/)
    # transpile already depends on compose; depending on both would run compose twice.
    deps:
      - transpile
    cmds:
      - echo "Copying composite WASM and jco component bundle into Python package..."
      - cp {{.DIST_SDK}} {{.PYTHON_WASM}}
      # rm -rf first so a stale transpile output never leaks into the wheel; the
      # destination is a pure build target, mirroring the release staging step.
      - |
        rm -rf clients/python/antikythera_agent/component
        mkdir -p clients/python/antikythera_agent/component
        cp -r clients/npm/antikythera-sdk/component/. clients/python/antikythera_agent/component/
      - echo ""
      - 'echo "OK composite copied to: {{.PYTHON_WASM}}"'
      - 'echo "OK jco component bundle copied to: clients/python/antikythera_agent/component"'

  build-all:
    desc: Build all WASM artifacts (standalone SDK + toolrunner + default-hooks + composite)
    cmds:
      - task: build-wasm-harness
      - task: build-toolrunner
      - task: build-default-hooks
      - task: compose

  wit:
    desc: Validate WIT file conformance against Rust source types
    cmds:
      - echo "Validating WIT conformance..."
      - cargo run -p build-scripts --release -- validate

  sync-version:
    desc: Sync npm and python package versions to the Cargo workspace version (single source of truth)
    cmds:
      - echo "Syncing npm and python versions from Cargo.toml..."
      - cargo run -p build-scripts --bin sync-release-version

  sync-version-check:
    desc: Verify npm and python package versions match the Cargo workspace version (no writes)
    cmds:
      - cargo run -p build-scripts --bin sync-release-version -- --check

  transpile:
    desc: Transpile composite WASM component to JS bindings with jco
    deps:
      - compose
    cmds:
      - echo "Transpiling composite WASM component with jco..."
      - node src/scripts/transpile-client.mjs
      - echo ""
      - echo "✓ Transpiled to clients/npm/antikythera-sdk/component"

  transpile-clean:
    desc: Remove generated jco entries while preserving source adapters and WASI stubs
    cmds:
      - echo "Cleaning transpiled output..."
      - node src/scripts/transpile-client.mjs --clean
      - echo "✓ Transpile output clean complete"

  # ===========================================================================
  # Run Tasks
  # ===========================================================================

  run:
    desc: Run chat agent (Ollama, default model)
    cmds:
      - echo "Starting chat agent..."
      - cargo run -p chat-example --release

  run-model:
    desc: Run chat agent with custom model
    cmds:
      - 'echo "Starting chat agent with model: {{.MODEL_NAME}}"'
      - cargo run -p chat-example --release -- {{.MODEL_NAME}}

  run-chat:
    desc: Run chat example from examples/chat
    dir: src/examples/chat
    cmds:
      - echo "Starting chat example..."
      - cargo run --release

  run-web:
    desc: Run web frontend dev server (Vite)
    dir: src/examples/antikythera-web
    cmds:
      - echo "Starting web frontend dev server..."
      - npm run dev

  build-web:
    desc: Build web frontend for production
    dir: src/examples/antikythera-web
    cmds:
      - echo "Building web frontend..."
      - npm run build
      - echo "✓ Web frontend built to src/examples/antikythera-web/dist/"

  # ===========================================================================
  # Test Tasks
  # ===========================================================================

  test:
    desc: Run all tests
    cmds:
      - echo "Running all tests..."
      - cargo test --workspace
      - echo ""
      - echo "✓ All tests passed"

  test-native:
    desc: Run tests (native target only)
    cmds:
      - echo "Running native tests..."
      - cargo test --workspace
      - echo ""
      - echo "✓ Native tests passed"

  test-sdk:
    desc: Run SDK tests
    cmds:
      - echo "Running SDK tests..."
      - cargo test -p antikythera-sdk --lib
      - echo ""
      - echo "✓ SDK tests passed"

  test-ffi:
    desc: Run FFI tests
    cmds:
      - echo "Running FFI tests..."
      - cargo test -p antikythera-sdk --lib ffi
      - echo ""
      - echo "✓ FFI tests passed"

  test-component:
    desc: Run component tests
    cmds:
      - echo "Running component tests..."
      - cargo test -p antikythera-sdk --lib component
      - echo ""
      - echo "✓ Component tests passed"

  # ===========================================================================
  # Check Tasks
  # ===========================================================================

  check:
    desc: Check all code
    cmds:
      - echo "Checking all code..."
      - cargo check --workspace
      - echo ""
      - echo "✓ Code check passed"

  check-native:
    desc: Check code (native target only)
    cmds:
      - echo "Checking native code..."
      - cargo check --workspace
      - echo ""
      - echo "✓ Native code check passed"

  check-wasm:
    desc: Check WASM compilation
    cmds:
      - echo "Checking WASM compilation..."
      - cargo check -p antikythera-sdk --target {{.WASM_TARGET}}
      - echo ""
      - echo "✓ WASM check passed"

  # ===========================================================================
  # Clean Tasks
  # ===========================================================================

  clean:
    desc: Clean all build artifacts
    cmds:
      - echo "Cleaning all build artifacts..."
      - cargo clean
      - echo "✓ Clean complete"

  clean-wasm:
    desc: Clean WASM build artifacts
    cmds:
      - echo "Cleaning WASM artifacts..."
      - rm -rf target/{{.WASM_TARGET}}
      - echo "✓ WASM clean complete"

  # ===========================================================================
  # Quality Tasks
  # ===========================================================================

  lint:
    desc: Run clippy linter
    cmds:
      - echo "Running clippy..."
      - cargo clippy --workspace -- -D warnings
      - echo ""
      - echo "✓ Clippy passed"

  format:
    desc: Format code with rustfmt
    cmds:
      - echo "Formatting code..."
      - cargo fmt --all
      - echo ""
      - echo "✓ Code formatted"

  # ===========================================================================
  # Inspection Tasks
  # ===========================================================================

  inspect:
    desc: Inspect the composite WASM component (dist/antikythera-sdk.wasm)
    deps:
      - build
    cmds:
      - echo "Inspecting composite WASM component..."
      - wasm-tools component info {{.DIST_SDK}} || echo "wasm-tools not installed"
      - echo ""
      - wasm-tools component wit {{.DIST_SDK}} || echo "wasm-tools not installed"

  size:
    desc: Show WASM artifact sizes
    cmds:
      - |
        echo "Binary Sizes:"
        echo "─────────────────────────────────"
        if [ -f "{{.WASM_BINARY}}" ]; then
          WASM_SIZE=$(stat -f%z "{{.WASM_BINARY}}" 2>/dev/null || stat -c%s "{{.WASM_BINARY}}" 2>/dev/null || echo "?")
          echo "  SDK standalone:   $WASM_SIZE bytes"
        else
          echo "  SDK standalone:   not built"
        fi
        if [ -f "{{.TOOLRUNNER_BINARY}}" ]; then
          TR_SIZE=$(stat -f%z "{{.TOOLRUNNER_BINARY}}" 2>/dev/null || stat -c%s "{{.TOOLRUNNER_BINARY}}" 2>/dev/null || echo "?")
          echo "  toolrunner:       $TR_SIZE bytes"
        else
          echo "  toolrunner:       not built"
        fi
        if [ -f "{{.DEFAULT_HOOKS_BINARY}}" ]; then
          DH_SIZE=$(stat -f%z "{{.DEFAULT_HOOKS_BINARY}}" 2>/dev/null || stat -c%s "{{.DEFAULT_HOOKS_BINARY}}" 2>/dev/null || echo "?")
          echo "  default-hooks:    $DH_SIZE bytes"
        else
          echo "  default-hooks:    not built"
        fi
        if [ -f "{{.LOGIC_CORE_TEMPLATE_BINARY}}" ]; then
          LC_T_SIZE=$(stat -f%z "{{.LOGIC_CORE_TEMPLATE_BINARY}}" 2>/dev/null || stat -c%s "{{.LOGIC_CORE_TEMPLATE_BINARY}}" 2>/dev/null || echo "?")
          echo "  logic-core template: $LC_T_SIZE bytes"
        else
          echo "  logic-core template: not built"
        fi
        if [ -f "{{.LOGIC_CORE_EXAMPLE_BINARY}}" ]; then
          LC_E_SIZE=$(stat -f%z "{{.LOGIC_CORE_EXAMPLE_BINARY}}" 2>/dev/null || stat -c%s "{{.LOGIC_CORE_EXAMPLE_BINARY}}" 2>/dev/null || echo "?")
          echo "  logic-core example:  $LC_E_SIZE bytes"
        else
          echo "  logic-core example:  not built"
        fi
        if [ -f "{{.DIST_SDK}}" ]; then
          COMPOSITE_SIZE=$(stat -f%z "{{.DIST_SDK}}" 2>/dev/null || stat -c%s "{{.DIST_SDK}}" 2>/dev/null || echo "?")
          echo "  composite (dist): $COMPOSITE_SIZE bytes"
        else
          echo "  composite (dist): not built"
        fi
        echo "─────────────────────────────────"
