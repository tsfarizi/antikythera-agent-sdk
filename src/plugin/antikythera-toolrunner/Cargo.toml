[package]
name = "antikythera-toolrunner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP tool registration, validation, and in-process execution for native and WASM targets"

[lib]
# rlib:   native Rust builds and tests.
# cdylib: required by cargo-component to emit the wasm32-wasip2 component
#         artifact (same dual crate-type as antikythera-sdk).
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "antikythera:agent-sdk"

# World exported by this component; `path` is resolved relative to this
# crate's manifest directory. The crate lives at plugin/antikythera-toolrunner,
# two levels below the repo root, so the canonical root `wit/` is `../../wit`
# (NOT `../wit`, which would resolve to the nonexistent plugin/wit).
[package.metadata.component.target]
path = "../../../wit"
world = "tool-registry-component"

[features]
default = []
log = ["dep:antikythera-log"]
# Server-side WASM Component Model support (wasm32-wasip2 WASI).
component = ["dep:wit-bindgen"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
antikythera-log = { path = "../../antikythera-log", default-features = false, optional = true }
# WIT bindings generator for the component world (component feature only).
# The pinned wit-bindgen version matches the toolchain's wit-parser so the emitted `component-type` sections decode cleanly.
wit-bindgen = { version = "0.40.0", optional = true }

[dev-dependencies]
antikythera-macros = { path = "../../antikythera-macros" }

[[test]]
name = "plugin_example"
path = "../../../tests/rust/toolrunner/plugin_example.rs"
