[package]
name = "antikythera-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core MCP protocol, transport layers, and agent runtime"

[dependencies]
# Core async runtime
futures.workspace = true
async-trait.workspace = true

# Logging
antikythera-log = { path = "../antikythera-log", version = "1.0.0", features = ["subscriber"] }

# Extracted crates
antikythera-domain = { path = "../antikythera-domain" }
antikythera-config = { path = "../antikythera-config" }
antikythera-ports = { path = "../antikythera-ports" }
antikythera-resilience = { path = "../antikythera-resilience" }
antikythera-tooling = { path = "../antikythera-tooling" }
antikythera-observability = { path = "../antikythera-observability" }


# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Error handling and logging
thiserror.workspace = true

# Utilities
uuid.workspace = true
base64.workspace = true
chrono.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Tokio features for native targets
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "process", "io-std"] }
# TUI and wizard (native only)
crossterm = { workspace = true }
# OS-level monitoring and env loading (native only — not WASM-compatible)
sysinfo.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Tokio features for WASM targets (limited — no rt-multi-thread, process, io-std)
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time", "io-util"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Browser WASI needs JS bindings for uuid randomness (via WASI random, jco stub)
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.39", features = ["test-util"] }
