<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Component runtime verification</title>
<body><pre id="result">Running browser Component Model checks...</pre>
<script type="module">
import { createRunner } from '../../clients/npm/antikythera-sdk/component/instantiate.js';
const result = document.querySelector('#result');
try {
  const a = await createRunner({ decideAction: () => ({ action:'final', content:'A' }) });
  const b = await createRunner({ decideAction: () => ({ action:'final', content:'B' }) });
  for (const [runner, label] of [[a,'A'],[b,'B'],[a,'A']]) {
    const id = runner.init(JSON.stringify({ session_id:'browser-session', runtime_hooks_enabled:true }));
    const prepared = runner.prepareUserTurn(JSON.stringify({ session_id:id, prompt:'hello' }));
    const commit = JSON.parse(runner.commitLlmResponse(prepared, '{"action":"final","content":"provider"}'));
    if (commit.content !== label) throw new Error(`hook isolation failed: ${commit.content}`);
  }
  a.resetSession('browser-session');
  b.getState('browser-session');
  result.textContent = 'PASS: browser jco Component Model\nPASS: private WASM instances\nPASS: independent hooks A / B / A\nPASS: reset does not affect another instance';
  document.body.dataset.status = 'passed';
} catch (error) {
  result.textContent = 'FAIL: ' + (error.stack || String(error));
  document.body.dataset.status = 'failed';
}
</script></body></html>
