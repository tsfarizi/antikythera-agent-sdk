# ============================================================================
# Dependencies
# ============================================================================

[dependencies]
antikythera-log = { path = "../../src/antikythera-log", features = ["subscriber"] }
antikythera-session = { path = "../../src/antikythera-session" }
antikythera-core = { path = "../../src/antikythera-core" }
antikythera-sdk = { path = "../../src/antikythera-sdk", features = ["component"] }
antikythera-storage = { path = "../../src/antikythera-storage", features = ["filesystem"] }
antikythera-security = { path = "../../src/antikythera-security", features = ["full"] }
antikythera-observability = { path = "../../src/antikythera-observability", features = ["full"] }
antikythera-ports = { path = "../../src/antikythera-ports" }
antikythera-domain = { path = "../../src/antikythera-domain" }
antikythera-macros = { path = "../../src/antikythera-macros" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
tempfile = "3.10"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "test-util"] }
serial_test = "3.0"
async-trait.workspace = true
clap.workspace = true
ratatui.workspace = true
