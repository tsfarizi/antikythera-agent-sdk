[workspace]
resolver = "2"
members = [
    # Layer 0: Types
    "src/antikythera-domain",
    "src/antikythera-ports",

    # Layer 1: Implementations
    "src/antikythera-config",
    "src/antikythera-log",
    "src/antikythera-resilience",
    "src/antikythera-tooling",
    "src/antikythera-observability",
    "src/antikythera-security",
    "src/antikythera-storage",

    # Layer 2: Core
    "src/antikythera-core",
    "src/antikythera-session",

    # Layer 3: Providers
    "src/antikythera-provider-ollama",
    "src/antikythera-provider-openai",
    "src/antikythera-provider-gemini",

    # Layer 4: SDK & Facade
    "src/antikythera-sdk",
    "src/antikythera-facade",

    # Layer 5: Server host runtime (U8 — wasmtime + wire bridge)
    "src/antikythera-server-runtime",

    # Layer 5: Deployment
    "src/plugin/antikythera-toolrunner",
    "src/plugin/antikythera-default-hooks",

    # Infra
    "src/scripts",
    "tests/rust",

    # Examples
    "src/examples/chat",
    "src/examples/component-harness",
    "src/examples/logic-hooks-template",
    "src/examples/logic-hooks-example",
    "src/examples/logic-core-template",
    "src/examples/logic-core-example",
    "src/examples/logic-core-host-example",

    # Build-time: Proc macros
    "src/antikythera-macros",
]


[workspace.package]
version = "1.8.5"
edition = "2024"
authors = ["tsfarizi"]
license = "MIT"
repository = "https://github.com/tsfarizi/antikythera-agent-sdk"
readme = "README.md"

[workspace.dependencies]
# Async runtime (base features for all targets)
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time", "io-util"] }
tokio-stream = "0.1.19"
async-trait = "0.1.91"
futures = "0.3.33"

# HTTP and networking (for core and storage)
reqwest = { version = "0.13.4", features = ["json", "stream"] }
reqwest-eventsource = "0.6.0"
axum = { version = "0.8.9", features = ["json"] }
tower-http = { version = "0.7.0", features = ["cors"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

# TUI (optional, used by antikythera-core wizard feature)
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.6.1", features = ["derive"] }

# Error handling and logging
thiserror = "2.0.19"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# Utilities
uuid = { version = "1.24.0", features = ["v4"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde", "wasmbind"] }
sysinfo = "0.38.4"
dotenvy = "0.15.7"
shellexpand = "3.1.2"

# Internal crates
antikythera-domain = { path = "src/antikythera-domain" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
