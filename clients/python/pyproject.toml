[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antikythera-agent"
version = "1.8.5"
description = "General-purpose agent runtime with multi-agent orchestration, MCP tool integration, and WebAssembly support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "tsfarizi"}
]
keywords = ["agent", "runtime", "mcp", "llm", "wasm", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
wasm = ["wasmtime>=42.0"]
dev = ["pytest>=7.0", "wasmtime>=42.0"]

[project.urls]
Homepage = "https://github.com/tsfarizi/antikythera-agent-sdk"
Repository = "https://github.com/tsfarizi/antikythera-agent-sdk"
Issues = "https://github.com/tsfarizi/antikythera-agent-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
# Positive include pins discovery to the actual distribution root. Without it,
# auto-discovery sweeps build/lib and tests/, so a second in-tree build nests
# build/lib/build/lib and blows past MAX_PATH on Windows.
include = ["antikythera_agent*"]

[tool.setuptools.package-data]
antikythera_agent = ["*.pyi", "py.typed", "*.wasm", "component/**", "delivery_assets/**"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.mypy]
# Mypy 2.x requires a >=3.10 analysis target; runtime remains >=3.9.
python_version = "3.10"
ignore_missing_imports = true
allow_redefinition = true
check_untyped_defs = true
